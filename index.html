<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J.A.R.V.I.S. 1.0</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#0b354b,#030b16 65%);color:#b9f3ff;font:16px system-ui,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center}.app{width:min(700px,94vw);text-align:center;padding:25px;border:1px solid #167ea0;border-radius:20px;background:#061523d9;box-shadow:0 0 50px #007db344}h1{letter-spacing:.4em;color:#72e6ff;font-size:clamp(25px,6vw,44px);margin:5px}small{color:#70b5ca}.core{margin:35px auto;width:210px;height:210px;border:4px solid #3bdcff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 30px #00c8ff,inset 0 0 35px #0077b7;position:relative;animation:pulse 3s infinite}.core:before{content:'';position:absolute;inset:15px;border:2px dashed #57d7f0;border-radius:50%;animation:spin 18s linear infinite}.core span{font-size:50px;font-weight:700;color:white;text-shadow:0 0 25px #5de6ff}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 60px #00c8ff,inset 0 0 55px #0077b7}}button{background:#083b55;border:1px solid #39d8fa;color:#c9f6ff;padding:13px 20px;border-radius:10px;font-size:16px;cursor:pointer;margin:6px}button:hover{background:#086080}input{background:#061d30;border:1px solid #258da9;border-radius:10px;color:white;padding:14px;font-size:16px;width:min(420px,100%)}#log{height:175px;overflow:auto;text-align:left;background:#03101d;border-radius:10px;padding:12px;margin:20px 0;color:#a7d5e0;line-height:1.6}.status{color:#69e7b0}p{margin:8px}</style></head><body><main class="app"><small>PERSONAL AI ASSISTANT • PROTOTYPE</small><h1>J.A.R.V.I.S.</h1><p class="status" id="status">Sistem hazır</p><div class="core"><span>J</span></div><div><button id="listen">🎙️ Konuş</button><button id="stop">🔇 Sesi durdur</button></div><form id="form"><input id="command" placeholder="Jarvis'e bir komut yaz..." autocomplete="off"><button>Gönder</button></form><div id="log" aria-live="polite">JARVIS: Hoş geldin. Komutlarını bekliyorum.</div><small>1.0 • Yerel komutlar • İnternet tabanlı AI henüz bağlı değil</small></main><script>
const log=document.getElementById('log'),status=document.getElementById('status');function add(who,msg){const p=document.createElement('p');p.textContent=who+': '+msg;log.append(p);log.scrollTop=log.scrollHeight}function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='tr-TR';u.rate=.95;speechSynthesis.speak(u)}function respond(raw){let s=raw.trim();if(!s)return;add('SEN',s);let t=s.toLocaleLowerCase('tr-TR'),answer;if(/saat kaç|saati söyle/.test(t))answer='Şu anda saat '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});else if(/bugün tarih|tarih ne|hangi gün/.test(t))answer='Bugün '+new Date().toLocaleDateString('tr-TR',{dateStyle:'full'});else if(/merhaba|selam|beni duyuyor musun/.test(t))answer='Evet, seni duyuyorum. Jarvis hizmetinde.';else if(/adın ne|kimsin/.test(t))answer='Ben Jarvis. Kişisel asistanının ilk sürümüyüm.';else if(/yardım|neler yapabilirsin/.test(t))answer='Saat, tarih, selamlama ve temel komutları destekliyorum. Diğer özellikler sonraki sürümlerde eklenecek.';else if(/teşekkür/.test(t))answer='Rica ederim.';else answer='Bu komutu henüz gerçekleştiremiyorum. Şimdilik saat, tarih, merhaba ve yardım komutlarını deneyebilirsin.';add('JARVIS',answer);speak(answer)}document.getElementById('form').onsubmit=e=>{e.preventDefault();respond(document.getElementById('command').value);document.getElementById('command').value=''};document.getElementById('stop').onclick=()=>speechSynthesis.cancel();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('listen').onclick=()=>{if(!SR){add('SİSTEM','Bu tarayıcı ses tanımayı desteklemiyor. Yazılı komut kullan.');return}let r=new SR();r.lang='tr-TR';r.interimResults=false;r.onstart=()=>status.textContent='Dinliyorum...';r.onresult=e=>respond(e.results[0][0].transcript);r.onerror=e=>{status.textContent='Mikrofon hatası: '+e.error};r.onend=()=>{if(status.textContent==='Dinliyorum...')status.textContent='Sistem hazır'};r.start()};</script></body></html>
